<style id="bsi-brand">:root{--bsi-night:#0d1520;--bsi-night2:#111c2a;--bsi-navy:#132033;--bsi-brass:#b39b70;--bsi-ink:#efe9dc;--bsi-ink2:#c9c3b6;--bsi-ink3:#8e8b84;--bsi-serif:"Libre Caslon",Baskerville,"Iowan Old Style",Georgia,serif;--bsi-sans:"Jost",ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}h1,h2,h3{font-family:var(--bsi-serif)}.bsi-top,.bsi-foot{box-sizing:border-box;width:100%;background:linear-gradient(180deg,var(--bsi-navy),var(--bsi-night));color:var(--bsi-ink);font:400 14px/1.5 var(--bsi-sans);border:1px solid rgba(179,155,112,.45)}.bsi-top *,.bsi-foot *{box-sizing:border-box}.bsi-top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;padding:8px 16px;margin:0 0 16px;border-width:0 0 1px}.bsi-top img{display:block;height:36px;width:auto}.bsi-top a{color:var(--bsi-ink);text-decoration:none}.bsi-cta{font:500 12px/1 var(--bsi-sans);letter-spacing:.14em;text-transform:uppercase;padding:10px 14px;border:1px solid var(--bsi-brass);color:var(--bsi-ink)!important}.bsi-cta:hover{background:var(--bsi-brass);color:var(--bsi-night)!important}.bsi-foot{margin:32px 0 0;padding:20px 16px;border-width:1px 0 0;text-align:left}.bsi-by{display:flex;align-items:center;gap:14px;max-width:960px;margin:0 auto}.bsi-hs{width:56px;height:56px;border-radius:50%;border:1px solid var(--bsi-brass);object-fit:cover;flex:none}.bsi-sig{display:block;height:40px;width:auto;margin:0 0 2px}.bsi-foot p{margin:0;color:var(--bsi-ink2);font:400 13px/1.5 var(--bsi-sans)}.bsi-foot .bsi-name{color:var(--bsi-ink);font:400 16px/1.3 var(--bsi-serif)}.bsi-foot .bsi-links{max-width:960px;margin:12px auto 0;padding-top:10px;border-top:1px solid rgba(179,155,112,.25);color:var(--bsi-ink3)}.bsi-foot a{color:var(--bsi-brass);text-decoration:underline;text-underline-offset:2px}</style>
